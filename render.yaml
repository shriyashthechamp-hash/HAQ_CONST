services:
  - type: web
    name: haq-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma && npx tsx apps/api/prisma/seed.ts && npm run start:api
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package*.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: ritu
      - key: SARVAM_STT_MODEL
        value: saaras:v2
      - key: CORS_ORIGIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true

